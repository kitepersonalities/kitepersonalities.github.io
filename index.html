<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>潍坊风筝人格测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">

    <!-- 首页 -->
    <div class="view active" id="start">
      <div class="start-frame">

        <svg class="ornament" viewBox="0 0 320 28" aria-hidden="true">
          <line x1="12" y1="14" x2="308" y2="14" stroke="#C73E2B" stroke-width="1.5"/>
          <path d="M160 4 L172 14 L160 24 L148 14 Z" fill="#E7B84B"/>
          <circle cx="122" cy="14" r="3" fill="#2F7D6D"/>
          <circle cx="198" cy="14" r="3" fill="#2F7D6D"/>
          <circle cx="82" cy="14" r="2.5" fill="#C73E2B"/>
          <circle cx="238" cy="14" r="2.5" fill="#C73E2B"/>
        </svg>

        <div class="kite-cloud">
          <img class="cloud-kite ck-1" src="images/龙头蜈蚣.png" alt="龙头蜈蚣风筝">
          <img class="cloud-kite ck-2" src="images/沙燕.png" alt="沙燕风筝">
          <img class="cloud-kite ck-3" src="images/老鹰.png" alt="老鹰风筝">
        </div>

        <h1 class="start-title">潍坊风筝人格测试</h1>

        <div class="start-intro">
          <p>潍坊的天空，飞过千百只风筝。</p>
          <p>每一只都有骨、有线，<br>也都有自己的脾气。</p>
          <p class="intro-ask">风起了，你——是哪一只？</p>
        </div>

        <button class="btn-primary" id="btn-start">开始测试</button>

        <div class="start-foot">14 道情景题 · 约 2 分钟</div>

        <svg class="ornament flip" viewBox="0 0 320 28" aria-hidden="true">
          <line x1="12" y1="14" x2="308" y2="14" stroke="#C73E2B" stroke-width="1.5"/>
          <path d="M160 4 L172 14 L160 24 L148 14 Z" fill="#E7B84B"/>
          <circle cx="122" cy="14" r="3" fill="#2F7D6D"/>
          <circle cx="198" cy="14" r="3" fill="#2F7D6D"/>
          <circle cx="82" cy="14" r="2.5" fill="#C73E2B"/>
          <circle cx="238" cy="14" r="2.5" fill="#C73E2B"/>
        </svg>

      </div>
    </div>

    <!-- 答题 -->
    <div class="view" id="quiz">
      <div class="quiz-top">
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-text" id="progress-text">1 / 14</div>
      </div>
      <div class="quiz-body">
        <div class="q-title" id="q-title"></div>
        <div class="q-text" id="q-text"></div>
        <div class="q-options" id="q-options"></div>
      </div>
      <div class="quiz-nav">
        <button class="btn-ghost" id="btn-prev">上一题</button>
        <button class="btn-primary" id="btn-next">下一题</button>
      </div>
    </div>

    <!-- 结果 -->
    <div class="view" id="result">
      <div class="result-hero" id="result-hero"></div>
      <div class="result-headline" id="result-headline"></div>
      <div class="result-sub" id="result-sub"></div>
      <div class="result-section-title">你的做事方式 · 工具</div>
      <div id="tool-card"></div>
      <div class="result-section-title">你的人生姿态 · 风筝</div>
      <div id="kite-card"></div>
      <div class="easter" id="easter"></div>
      <button class="btn-primary" id="btn-poster">生成我的专属海报</button>
      <button class="btn-link btn-retest">再测一次</button>
    </div>

    <!-- 海报 -->
    <div class="view" id="poster">
      <div class="poster-tip">👇 长按图片保存到相册</div>
      <img class="poster-img" id="poster-img" alt="我的风筝人格海报">
      <canvas id="poster-canvas" style="display:none"></canvas>
      <div class="poster-actions">
        <button class="btn-primary" id="btn-save">保存图片</button>
        <button class="btn-link btn-retest">再测一次</button>
      </div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
